apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-monitor
spec:
  # 공유 DB여도 consumer는 단일 실행: 파티션별 감시 소유권은 아직 없습니다.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healthcheck-monitor
  template:
    metadata:
      labels:
        app: healthcheck-monitor
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: initialize-postgres
          image: REPLACE_WITH_IMAGE
          command: ["python", "-m", "heartbeat_mailer.postgres"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthcheck-monitor-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: healthcheck-monitor
          image: REPLACE_WITH_IMAGE
          envFrom:
            - configMapRef:
                name: healthcheck-monitor-config
            - secretRef:
                name: healthcheck-monitor-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: api
          image: REPLACE_WITH_IMAGE
          command: ["python", "-m", "uvicorn", "heartbeat_mailer.api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: api
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: healthcheck-monitor-secret
                  key: DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: healthcheck-monitor-secret
                  key: API_TOKEN
            - name: HEARTBEAT_STALE_AFTER_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: healthcheck-monitor-config
                  key: HEARTBEAT_STALE_AFTER_SECONDS
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            timeoutSeconds: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: api
            initialDelaySeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: healthcheck-monitor-api
spec:
  type: ClusterIP
  selector:
    app: healthcheck-monitor
  ports:
    - port: 8000
      targetPort: api
