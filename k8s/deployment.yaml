apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: healthcheck-monitor
  template:
    metadata:
      labels:
        app: healthcheck-monitor
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: healthcheck-monitor
          image: REPLACE_WITH_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: healthcheck-monitor-config
            - secretRef:
                name: healthcheck-monitor-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: healthcheck-monitor-state
